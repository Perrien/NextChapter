name: Update prices and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A second attempt catches a delayed/dropped primary timer event. The gate
    # below skips a slot that already has a successfully published price snapshot.
    - cron: '15,45 11,14,21 * * 1-5'
      timezone: America/Chicago

permissions:
  contents: read

concurrency:
  group: next-chapter-pages
  cancel-in-progress: false

jobs:
  refresh-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.due.outputs.should_run }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Check whether this refresh slot is still due
        id: due
        run: python3 scripts/refresh_due.py
  publish:
    needs: refresh-check
    if: github.ref == 'refs/heads/main' && needs.refresh-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned build dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test calculations and protected builds
        run: npm test
      - name: Download fresh public prices
        if: github.event_name != 'push'
        run: npm run update:data
      - name: Validate saved market data
        run: npm run verify:public
      - name: Build encrypted static site
        run: npm run build
      - name: Audit publication files
        run: npm run verify:artifact
      - name: Save successful prices durably
        if: github.event_name != 'push'
        run: |
          git add -- data/market.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh market snapshot'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload protected site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
