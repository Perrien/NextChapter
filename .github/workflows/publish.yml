name: Update prices and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Explicit UTC checks cover both Central offsets (CST/CDT). The Python gate
    # chooses the latest due Central-time slot, including a missed prior night.
    # Extra checks skip downloads when that slot has already been published.
    - cron: '15,45 16,17,19,20 * * 1-5'
    - cron: '15,45 2,3 * * 2-6'

permissions:
  contents: read

concurrency:
  group: next-chapter-pages
  cancel-in-progress: false

jobs:
  refresh-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.due.outputs.should_run }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Check whether this refresh slot is still due
        id: due
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: python3 scripts/refresh_due.py
  publish:
    needs: refresh-check
    if: github.ref == 'refs/heads/main' && needs.refresh-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned build dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test calculations and protected builds
        run: npm test
      - name: Download fresh public prices
        if: github.event_name != 'push'
        run: npm run update:data
      - name: Validate saved market data
        run: npm run verify:public
      - name: Build encrypted static site
        run: npm run build
      - name: Audit publication files
        run: npm run verify:artifact
      - name: Save successful prices durably
        if: github.event_name != 'push'
        run: |
          git add -- data/market.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh market snapshot'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload protected site
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
      - name: Wait for uploaded site artifact
        id: artifact_ready
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: python3 scripts/wait_for_pages_artifact.py
      - name: Publish to Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 180000
      - name: Wait before retrying Pages publication
        if: steps.deployment.outcome == 'failure'
        run: |
          echo 'Pages publication failed; retrying the same uploaded site in 20 seconds.'
          sleep 20
      - name: Retry Pages publication
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 180000
      - name: Summarize Pages publication
        if: always() && steps.upload.outcome == 'success'
        env:
          READINESS: ${{ steps.artifact_ready.outcome }}
          FIRST_ATTEMPT: ${{ steps.deployment.outcome }}
          RETRY_ATTEMPT: ${{ steps.deployment_retry.outcome }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['RETRY_ATTEMPT'] == 'success':
              message = 'Published successfully after an automatic retry.'
          elif os.environ['FIRST_ATTEMPT'] == 'success':
              message = 'Published successfully on the first attempt.'
          elif os.environ['READINESS'] != 'success':
              message = 'Artifact readiness check failed. The previous published site remains online.'
          else:
              message = 'Both publication attempts failed. The previous published site remains online.'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n## Pages publication\n\n' + message + '\n')
          print(message)
          PY
